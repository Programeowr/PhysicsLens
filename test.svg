  </defs>
  <text x="450.0" y="38.0" text-anchor="middle" fill="#222" font-family="Inter, Roboto, Source Sans Pro, Arial, sans-serif" font-size="24" font-weight="bold">Horizontal Free-Body Diagram</text>
  <g id="background">
