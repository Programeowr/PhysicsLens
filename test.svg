    <circle cx="450.0" cy="310.0" r="5" fill="#d62728"/>
    <text x="450.0" y="478.0" fill="#d62728" font-family="Inter, Roboto, Source Sans Pro, Arial, sans-serif" font-size="14" font-weight="700">W = 147.0 N</text>
    <line x1="450.0" y1="310.0" x2="450.0" y2="130.0" stroke="#1f77b4" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
    <circle cx="450.0" cy="310.0" r="5" fill="#1f77b4"/>
    <text x="450.0" y="118.0" fill="#1f77b4" font-family="Inter, Roboto, Source Sans Pro, Arial, sans-serif" font-size="14" font-weight="700">N = 147.0 N</text>
    <line x1="450.0" y1="310.0" x2="270.0" y2="310.0" stroke="#2ca02c" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
    <circle cx="450.0" cy="310.0" r="5" fill="#2ca02c"/>
    <text x="270.0" y="298.0" fill="#2ca02c" font-family="Inter, Roboto, Source Sans Pro, Arial, sans-serif" font-size="14" font-weight="700">f = 36.8 N</text>
    <line x1="450.0" y1="310.0" x2="630.0" y2="310.0" stroke="#9467bd" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowhead)"/>
    <circle cx="450.0" cy="310.0" r="5" fill="#9467bd"/>
    <text x="630.0" y="298.0" fill="#9467bd" font-family="Inter, Roboto, Source Sans Pro, Arial, sans-serif" font-size="14" font-weight="700">F = 60.0 N</text>
