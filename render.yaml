services:
  - type: web
    name: physicslens-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn physics_diagram.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14
      - key: ALLOWED_ORIGINS
        value: https://your-frontend-url.com
    healthCheckPath: /
